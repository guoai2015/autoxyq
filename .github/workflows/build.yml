name: Build autoxyq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          Write-Host "Downloading Windows Driver Kit..."
          $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2272693"
          $wdkInstaller = "$env:TEMP\wdksetup.exe"
          curl.exe -L -o $wdkInstaller $wdkUrl --retry 3 --retry-delay 5
          if (-not (Test-Path $wdkInstaller)) {
            Write-Error "WDK download failed: file not found"
            exit 1
          }
          $size = (Get-Item $wdkInstaller).Length
          Write-Host "Downloaded WDK installer: $size bytes"
          if ($size -lt 1048576) {
            Write-Error "WDK download failed: file too small ($size bytes)"
            exit 1
          }
          Write-Host "Installing WDK (silent, may take several minutes)..."
          Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet", "/norestart" -Wait -NoNewWindow
          Write-Host "WDK installation complete"

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Run Unit Tests
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Package Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/driver
          New-Item -ItemType Directory -Force -Path artifacts/lib
          Copy-Item build/driver/Release/autoxyq-drv.dll artifacts/driver/ -ErrorAction SilentlyContinue
          Copy-Item build/driver/Release/autoxyq-drv.pdb artifacts/driver/ -ErrorAction SilentlyContinue
          Copy-Item driver/autoxyq-drv.inx artifacts/driver/
          Copy-Item scripts/install-driver.ps1 artifacts/driver/
          Copy-Item scripts/uninstall-driver.ps1 artifacts/driver/
          Copy-Item build/lib/Release/autoxyq.dll artifacts/lib/ -ErrorAction SilentlyContinue
          Copy-Item build/lib/Release/autoxyq.lib artifacts/lib/ -ErrorAction SilentlyContinue
          Copy-Item lib/autoxyq.h artifacts/lib/
          Copy-Item lib/autoxyq-error.h artifacts/lib/
          Copy-Item build/cli/Release/autoxyq-cli.exe artifacts/ -ErrorAction SilentlyContinue

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoxyq-build
          path: artifacts/
          retention-days: 7
