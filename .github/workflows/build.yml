name: Build autoxyq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Run Unit Tests
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Package Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/lib
          New-Item -ItemType Directory -Force -Path artifacts/cli
          Copy-Item build/lib/Release/autoxyq.dll artifacts/lib/ -ErrorAction SilentlyContinue
          Copy-Item build/lib/Release/autoxyq.lib artifacts/lib/ -ErrorAction SilentlyContinue
          Copy-Item lib/autoxyq.h artifacts/lib/
          Copy-Item lib/autoxyq-error.h artifacts/lib/
          Copy-Item build/cli/Release/autoxyq-cli.exe artifacts/cli/ -ErrorAction SilentlyContinue

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoxyq-build
          path: artifacts/
          retention-days: 7
